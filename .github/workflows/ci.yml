# CI — the required merge gate for Siyur (DU-00, test-strategy.md §"CI gating").
#
# This file carries jobs 1,2,3,5,6,7 of the 7-job gate; jobs 4 (deterministic
# evals) and 8 (llm-judge) live in eval-quality.yml so a non-deterministic judge
# flake can never block a hotfix (test-strategy.md §"Evals"). Required merge
# checks are 1–7; wire them into branch protection at DU-00 (ADR-0005).
#
# Green-on-stubs discipline (test-strategy.md §"Applying to DUs"): DU-00 stands
# every gate up green BEFORE the features exist. Jobs whose product code has not
# landed yet (3 integration service-containers, 5 Playwright airplane-mode) run
# as documented green placeholders here and grow real dependencies at DU-01+/the
# web scaffold — the check *name* exists and is required from day one.
#
# Workflow edits are `ask`-gated, never auto (ADR-0006): CI config is
# security-critical, so a human approves every change and cloud/headless sessions
# fail closed. Keep security jobs at ZERO advisory ignores (ADR-0007 amendment).

name: CI

on:
  pull_request:
    # labeled/unlabeled so toggling `size-override` re-runs diff-guard with fresh
    # PR state (the other types are the pull_request defaults, restated because an
    # explicit `types:` list replaces them).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# One in-flight run per ref; a new push cancels the stale one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read code; read PR metadata (gitleaks lists PR commits;
# diff-guard reads the live label set).
permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Job 1 · lint + typecheck (ruff, mypy, tsc) ─────────────────────────────
  lint-typecheck:
    name: "1 · lint + typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + Python (pinned via .python-version)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy .
      # web/ TypeScript typecheck (Vite scaffold, DU-00 web slice). pnpm before
      # setup-node so `cache: pnpm` can find it.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - name: tsc (web)
        run: pnpm -C web typecheck

  # ── Job 2 · unit (py + web) ────────────────────────────────────────────────
  unit:
    name: "2 · unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Tier-1 Python unit tests (pure, <1s each). pytest-xdist sharding is added
      # when the suite is large enough to need it (test-strategy.md §"CI gating").
      - name: pytest (Tier 1, tests/)
        run: uv run pytest tests/ -q
      # web/ unit tests (vitest + jsdom). pnpm before setup-node for the cache.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - name: vitest (web)
        run: pnpm -C web test

  # ── Job 3 · integration & component ────────────────────────────────────────
  # Real PostGIS service container (T006, Spec 001). Tier-2 tests select on the
  # `integration` marker; until the first one lands (T016/T017) pytest collects
  # nothing and exits 5, which we translate to success — the gate stays green
  # without an echo stub, and the probe step below still proves the service
  # container genuinely works, so T016 inherits a de-risked harness.
  #
  # Valhalla + fake-gcs stay commented: they are DU-05 (compile → bundle)
  # dependencies, and booting them now would only slow every PR.
  integration:
    name: "3 · integration & component"
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: siyur
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
      # valhalla: { image: ghcr.io/valhalla/valhalla:latest, ports: ["8002:8002"] }  # DU-05
      # fake-gcs: { image: fsouza/fake-gcs-server:latest,    ports: ["4443:4443"] }  # DU-05
    env:
      # Consumed by alembic/env.py and the tests/conftest.py PostGIS fixture.
      # A CI-only throwaway credential for an ephemeral service container — not a
      # secret, and never read from .env*/secrets/ (Constitution Article V).
      SIYUR_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/siyur
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + Python (pinned via .python-version)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: uv sync
        run: uv sync --all-extras --dev
      - name: verify PostGIS service is reachable and spatially enabled
        run: |
          uv run python - <<'PY'
          import os, sys, psycopg
          url = os.environ["SIYUR_DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://")
          with psycopg.connect(url) as conn, conn.cursor() as cur:
              cur.execute("CREATE EXTENSION IF NOT EXISTS postgis")
              cur.execute("SELECT PostGIS_Version()")
              print("PostGIS ready:", cur.fetchone()[0])
          PY
      - name: pytest (Tier 2, `integration` marker)
        run: |
          set +e
          uv run pytest -q -m integration
          code=$?
          set -e
          # 5 = "no tests collected": expected until T016/T017 land the first
          # Tier-2 test. Any other non-zero is a real failure.
          if [ "$code" -eq 5 ]; then
            echo "No Tier-2 integration tests collected yet (expected pre-T016) — gate green."
            exit 0
          fi
          exit "$code"

  # ── Job 5 · e2e (Playwright, Chromium) — THE MERGE GATE ────────────────────
  # **No longer a stub.** This job was three `echo` lines from DU-00 until DU-06a,
  # so for nine deliverable units "the merge gate" gated nothing — which is exactly
  # how the product reached `main` unusable on a phone (FAIL-012).
  #
  # It runs **`viewport.spec.ts` only** — DU-06a's rendered-viewport gate at
  # 375/390/430 (+1440 for the ODbL attribution). It lands RED on purpose: the known
  # failures carry `test.fail()`, so CI is green while the defects stand and goes
  # **red the moment a fix lands without deleting its marker**.
  #
  # `airplane.spec.ts` is deliberately NOT run here yet — a scope decision, not a
  # quality one. That suite belongs to **DU-06/T056**, which owns it and will have a
  # real bundle to gate on; switching it on is deleting the filename below.
  #
  # It is NOT excluded for flakiness. One combined local run did fail on `the app
  # shell survives an offline reload at all`, but the cause was found and it is not
  # the suite: `reuseExistingServer: !process.env.CI` means a local run reuses a
  # preview server that a concurrent `pnpm build` has just rewritten `dist/` under.
  # Killing the stale server made it green, and the full suite then passed 3 of 3
  # clean CI-mode runs (23 tests, ~13 s). **CI never hits this** — it sets
  # `reuseExistingServer: false` and builds fresh. Recorded because "we thought it
  # was flaky" is exactly the kind of unexamined belief that keeps a gate stubbed.
  #
  # Chromium only (ADR-0002 makes the offline runtime Chromium-first).
  # Job key and display name both unchanged: all seven checks are REQUIRED on `main`
  # by name, so renaming either would present branch protection with a missing check.
  e2e-airplane:
    name: "5 · e2e-airplane (merge gate)"
    runs-on: ubuntu-latest
    # `webServer.timeout` alone is 180 s, and this job builds before it tests. A
    # required check with no ceiling is how a hung runner becomes a blocked repo.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm before setup-node so `cache: pnpm` can find it (same order as jobs 1-2).
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      # The browser download is ~150 MB and dwarfs the suite itself, which runs in
      # ~11 s locally and 16 s here. Cached on the resolved Playwright version
      # because a slow gate is a gate people learn to ignore.
      #
      # **Measured: 55 s end to end** (install + browser restore + `vite build` via
      # playwright.config.ts's `webServer` + 20 tests), so this job does sit inside
      # the 7 s–1 m 40 s band the other six hold. Recorded from the first green run
      # rather than predicted — AGENTS.md uses that band as the triage heuristic for
      # red checks, and a guessed number degrades the rule for everyone reading it.
      # Re-measure if the cache is ever removed; the browser restore is the variable.
      - name: resolve Playwright version
        id: pw
        run: echo "version=$(pnpm -C web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: install Chromium (+ system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm -C web exec playwright install --with-deps chromium
      # A cache hit restores the browser but not the apt libraries it links against.
      - name: install system deps only (cached browser)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm -C web exec playwright install-deps chromium
      - name: playwright (DU-06a viewport gate)
        run: pnpm -C web exec playwright test viewport.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

  # ── Job 6 · security (Semgrep + gitleaks + pip-audit + slopsquatting) ──────
  security:
    name: "6 · security"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # SAST: public rulesets, no registry token needed.
      - name: semgrep (SAST)
        run: uvx semgrep scan --config p/python --config p/security-audit --error
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Dependency CVE audit — ZERO ignores (ADR-0007 amendment): reddens only on
      # genuinely new advisories. The two DU-00 findings were fixed by pin bumps
      # (pytest ~=9.0, langchain>=1.3.9 constraint), not ignored.
      - name: pip-audit (dependency CVEs)
        run: |
          uv export --no-emit-project --format requirements-txt > requirements.audit.txt
          uvx pip-audit -r requirements.audit.txt
      # Slopsquatting / hallucinated-package gate: --locked fails if pyproject and
      # the lock disagree, i.e. any dep name that does not resolve to a real,
      # pinned PyPI package. Cheap, deterministic, no network beyond the index.
      - name: slopsquatting gate (uv lock --locked)
        run: uv lock --locked

  # ── Job 7 · diff-guard (>500 changed lines without `size-override`) ────────
  # PR-only. Counts human-authored churn; excludes generated lockfiles so a
  # routine dependency bump never trips it. A legitimately large PR (e.g. the
  # DU-00 skeleton) attaches the `size-override` label as the escape hatch.
  diff-guard:
    name: "7 · diff-guard"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: guard changed-line count
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the label from LIVE PR state, not the triggering event payload:
          # a `size-override` added AFTER the last push must still count (the
          # payload froze the label set at push time).
          if gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' \
              | grep -qx 'size-override'; then
            echo "size-override label present — diff-guard skipped."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          # Exclude machine-produced content from the human-churn count. The guard
          # exists to keep *review effort* bounded, so anything a reviewer reads at
          # a glance (or not at all) must not consume the budget:
          #   - lockfiles         — resolver output, reviewed via the manifest
          #   - tests/fixtures/** — CAPTURED source data (Overture parquet, Overpass
          #                         JSON). Reviewed by provenance notes in the
          #                         fixture README, not line by line.
          #   - alembic scaffold  — verbatim `alembic init` output (alembic.ini is
          #                         155 lines, 123 of them comments). NOTE: env.py
          #                         and alembic/versions/** stay counted — those are
          #                         genuinely authored and migrations need real review.
          #   - LICENSE / LICENSE-* — canonical licence texts, fetched verbatim from
          #                         the GitHub licences API. Apache-2.0 is 202 lines
          #                         and CC BY 4.0 is 396; nobody reviews either line
          #                         by line, and nobody should — the review question
          #                         is "which licence is this", answered by the file
          #                         name and by LICENSING.md, which IS counted.
          #                         Same category as a lockfile: machine-produced
          #                         text whose correctness comes from its source,
          #                         not from a reader. NOTE the glob is anchored and
          #                         does not match LICENSING.md — the reasoning about
          #                         *why* these licences were chosen is authored prose
          #                         and must keep consuming budget.
          CHANGED=$(git diff --numstat "$BASE_SHA"...HEAD -- . \
            ':(exclude)uv.lock' \
            ':(exclude)**/pnpm-lock.yaml' \
            ':(exclude)**/package-lock.json' \
            ':(exclude)tests/fixtures/**' \
            ':(exclude)alembic.ini' \
            ':(exclude)alembic/script.py.mako' \
            ':(exclude)alembic/README' \
            ':(exclude)LICENSE' \
            ':(exclude)LICENSE-*' \
            | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "Human-authored changed lines (excluding generated/captured files): $CHANGED"
          if [ "$CHANGED" -gt 500 ]; then
            echo "::error::Diff exceeds 500 lines ($CHANGED). Split the PR, or add the 'size-override' label with justification."
            exit 1
          fi
          echo "Under the 500-line limit."

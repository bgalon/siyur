# CI — the required merge gate for Siyur (DU-00, test-strategy.md §"CI gating").
#
# This file carries jobs 1,2,3,5,6,7 of the 7-job gate; jobs 4 (deterministic
# evals) and 8 (llm-judge) live in eval-quality.yml so a non-deterministic judge
# flake can never block a hotfix (test-strategy.md §"Evals"). Required merge
# checks are 1–7; wire them into branch protection at DU-00 (ADR-0005).
#
# Green-on-stubs discipline (test-strategy.md §"Applying to DUs"): DU-00 stands
# every gate up green BEFORE the features exist. Jobs whose product code has not
# landed yet (3 integration service-containers, 5 Playwright airplane-mode) run
# as documented green placeholders here and grow real dependencies at DU-01+/the
# web scaffold — the check *name* exists and is required from day one.
#
# Workflow edits are `ask`-gated, never auto (ADR-0006): CI config is
# security-critical, so a human approves every change and cloud/headless sessions
# fail closed. Keep security jobs at ZERO advisory ignores (ADR-0007 amendment).

name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; a new push cancels the stale one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Job 1 · lint + typecheck (ruff, mypy, tsc) ─────────────────────────────
  lint-typecheck:
    name: "1 · lint + typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv + Python (pinned via .python-version)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy .
      # tsc lands with the web/ Vite scaffold (DU-00 web slice); guard until then.
      - name: tsc (web)
        if: ${{ hashFiles('web/tsconfig.json') != '' }}
        run: |
          echo "TODO(web scaffold): pnpm -C web tsc --noEmit"

  # ── Job 2 · unit (py + web) ────────────────────────────────────────────────
  unit:
    name: "2 · unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Tier-1 Python unit tests (pure, <1s each). pytest-xdist sharding is added
      # when the suite is large enough to need it (test-strategy.md §"CI gating").
      - name: pytest (Tier 1, tests/)
        run: uv run pytest tests/ -q
      # vitest lands with the web/ scaffold; guard until package.json exists.
      - name: vitest (web)
        if: ${{ hashFiles('web/package.json') != '' }}
        run: |
          echo "TODO(web scaffold): pnpm -C web test --run"

  # ── Job 3 · integration & component ────────────────────────────────────────
  # Green stub. Tier-2 tests (planner pipeline + SQLite checkpoint, real PostGIS,
  # Valhalla legs, fake-gcs bundle objects, DuckDB over an Overture fixture) land
  # at DU-01+. The GitHub Actions `services:` wiring below is the intended shape —
  # kept commented so this required check exists and stays green until then.
  integration:
    name: "3 · integration & component"
    runs-on: ubuntu-latest
    # services:
    #   postgis:
    #     image: postgis/postgis:16-3.4
    #     env: { POSTGRES_PASSWORD: postgres }
    #     ports: ["5432:5432"]
    #     options: >-
    #       --health-cmd "pg_isready" --health-interval 10s
    #       --health-timeout 5s --health-retries 5
    #   valhalla:  { image: ghcr.io/valhalla/valhalla:latest, ports: ["8002:8002"] }
    #   fake-gcs:  { image: fsouza/fake-gcs-server:latest,     ports: ["4443:4443"] }
    steps:
      - uses: actions/checkout@v4
      - name: no Tier-2 tests yet (green stub)
        run: |
          echo "Tier-2 integration & component tests land at DU-01+ "
          echo "(planner pipeline, PostGIS, Valhalla, fake-gcs, DuckDB fixture)."
          echo "Green stub — the required gate exists before the feature does."

  # ── Job 5 · e2e-airplane (Playwright, Chromium) — THE MERGE GATE ───────────
  # Green stub. The airplane-mode flow (load online → wait for SW + OPFS whole-
  # archive download → setOffline(true) → reload → assert tiles render from OPFS
  # with ZERO network calls; test-strategy.md §"Tier 3") needs the web PWA +
  # a compiled bundle, which land at the web scaffold / DU-06. Stubbed until then.
  e2e-airplane:
    name: "5 · e2e-airplane (merge gate)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no web PWA yet (green stub)
        run: |
          echo "Airplane-mode E2E (Playwright/Chromium) is the release merge gate."
          echo "It needs the web PWA + compiled bundle (web scaffold / DU-06)."
          echo "Green stub — the merge gate exists before the offline runtime does."

  # ── Job 6 · security (Semgrep + gitleaks + pip-audit + slopsquatting) ──────
  security:
    name: "6 · security"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # SAST: public rulesets, no registry token needed.
      - name: semgrep (SAST)
        run: uvx semgrep scan --config p/python --config p/security-audit --error
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Dependency CVE audit — ZERO ignores (ADR-0007 amendment): reddens only on
      # genuinely new advisories. The two DU-00 findings were fixed by pin bumps
      # (pytest ~=9.0, langchain>=1.3.9 constraint), not ignored.
      - name: pip-audit (dependency CVEs)
        run: |
          uv export --no-emit-project --format requirements-txt > requirements.audit.txt
          uvx pip-audit -r requirements.audit.txt
      # Slopsquatting / hallucinated-package gate: --locked fails if pyproject and
      # the lock disagree, i.e. any dep name that does not resolve to a real,
      # pinned PyPI package. Cheap, deterministic, no network beyond the index.
      - name: slopsquatting gate (uv lock --locked)
        run: uv lock --locked

  # ── Job 7 · diff-guard (>500 changed lines without `size-override`) ────────
  # PR-only. Counts human-authored churn; excludes generated lockfiles so a
  # routine dependency bump never trips it. A legitimately large PR (e.g. the
  # DU-00 skeleton) attaches the `size-override` label as the escape hatch.
  diff-guard:
    name: "7 · diff-guard"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: guard changed-line count
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'size-override') }}
        run: |
          if [ "$HAS_OVERRIDE" = "true" ]; then
            echo "size-override label present — diff-guard skipped."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          # Exclude generated lockfiles from the human-churn count.
          CHANGED=$(git diff --numstat "$BASE_SHA"...HEAD -- . \
            ':(exclude)uv.lock' \
            ':(exclude)**/pnpm-lock.yaml' \
            ':(exclude)**/package-lock.json' \
            | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "Human-authored changed lines (excluding lockfiles): $CHANGED"
          if [ "$CHANGED" -gt 500 ]; then
            echo "::error::Diff exceeds 500 lines ($CHANGED). Split the PR, or add the 'size-override' label with justification."
            exit 1
          fi
          echo "Under the 500-line limit."

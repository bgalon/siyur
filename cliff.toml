# git-cliff — conventional commits → CHANGELOG.md, Keep-a-Changelog shaped.
#
# Ramp-up step 20 (`methods-ramp-up-standards.md` §7). `CHANGELOG.md` is GENERATED:
# fix this config and regenerate, never hand-edit the output (AGENTS.md).
#
#   git-cliff -o CHANGELOG.md          # whole history
#   git-cliff --unreleased --prepend CHANGELOG.md
#
# Grouping follows the commit types this repo actually uses. `docs:` is a
# first-class section rather than noise: ADRs, devlog entries and schema cards are
# deliverables here, not chores — the build is teaching material (AGENTS.md
# "Course-feed"), so a docs commit is often the point of the session.

[changelog]
header = """
# Changelog

Generated by [git-cliff](https://git-cliff.org) from conventional commits.
Do not hand-edit — run `git-cliff -o CHANGELOG.md`.\n
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# Merge commits carry no information a reader wants — the PR's own commits do.
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Tests" },
  { message = "^docs", group = "Docs, decisions & course artifacts" },
  { message = "^style", group = "Style" },
  { message = "^chore", group = "Chores" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  # Merge commits: the branch's own commits already say what landed.
  { message = "^Merge pull request", skip = true },
  { message = "^Merge branch", skip = true },
  { message = "^Merge remote-tracking", skip = true },
]

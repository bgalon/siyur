[project]
name = "siyur"
version = "0.0.0"
description = "Siyur — plan a tour day online with an LLM, compile a self-contained offline map bundle, travel with zero connectivity."
requires-python = ">=3.12,<3.13"
readme = "README.md"

# Pinned to majors with compatible-release (~=) per the stack reference + the
# geo stale-API discipline in AGENTS.md. Geo pins are exact-major and verified
# (shapely 2.1.x / h3 4.5.x / osmnx 2.1.x / geopandas 1.1.x). The planner-seam
# (pydantic-ai, litellm — ADR-0004, NOT langgraph) and eval libs (deepeval,
# agentevals) land here at DU-00 unit d, pinned against the versions uv resolved
# at scaffolding time (ADR-0007) — not guessed. Spec-001 Phase 1 setup (T001)
# adds the rest of the slice-001 dependency set the same way (resolve-then-pin):
# geoalchemy2/httpx (ingestion + PostGIS bridge), anthropic (the seam's M1
# provider SDK — import stays confined to commons/llm.py, guarded by
# tests/test_llm_seam.py at DU-02), testcontainers/syrupy (dev group, Tier-2 +
# snapshot testing). No transliteration package is pinned — see ADR-0010
# amendment (PyICU confirmed a CI build hazard: no wheels, requires
# pkg-config + system libicu-dev we cannot add without editing CI workflows,
# which is review-gated per ADR-0006).
dependencies = [
    # --- geospatial core (see AGENTS.md "Geo APIs" table — do NOT emit v-old idioms) ---
    "shapely~=2.1",
    "h3~=4.5",
    "osmnx~=2.1",
    "geopandas~=1.1",
    "pyproj~=3.7",
    "duckdb~=1.3",
    # --- slice-002 deterministic engines (the model does none of this arithmetic) ---
    # opening_hours evaluation for feasibility (ADR-0022). Rust-backed bindings over
    # remi-dupre/opening-hours-rs; MIT OR Apache-2.0, so no LGPL obligation and no second
    # language runtime in compile or CI — the canonical evaluator is opening_hours.js.
    #
    # ⚠️ The distribution is `opening-hours-py`, imported as `opening_hours`.
    # `pip install opening-hours` gets a DIFFERENT, abandoned package: v0.1.1, last
    # uploaded 2016-11-28, licence UNKNOWN (anthill/Python_OpeningHours). Verified against
    # PyPI on 2026-08-07 before locking, per Constitution Article V. One hyphen apart.
    "opening-hours-py~=2.1",
    # IANA **timezone** for an area (ADR-0025 ruling 2), offline so area resolution stays
    # reproducible in CI. Two limits, both verified by execution rather than assumed:
    #
    #   1. It answers for a POINT. The normative rule in docs/data/area.md is
    #      largest-intersecting-area, so this covers the permitted single-zone
    #      optimization only. `get_geometry(tz_name=...)` exposes zone polygons if the
    #      full rule is needed.
    #   2. It does NOT resolve `country_code` — there is no country API on it at all.
    #      `area.country_code` is a required M1 field and `opening-hours-py` needs it for
    #      `PH` resolution, so **T008 still lacks a country source**. Not solved by this
    #      dependency; do not write T008 assuming otherwise.
    "timezonefinder~=8.2",
    # Wikivoyage/Wikipedia wikitext → narration (ADR-0024). The listing templates are the
    # structured prize; parsing them beats scraping rendered HTML.
    "mwparserfromhell~=0.7",
    # --- data model + web/service spine ---
    "pydantic~=2.11",
    "fastapi~=0.118",
    "uvicorn~=0.34",
    # --- api auth: server-side Google OIDC login (DU-00 "SSO works" slice) ---
    # Resolve-then-pin (ADR-0007): added unbounded → uv lock → tightened to the
    # resolved ~=major.minor. authlib = OAuth2/OIDC client (Google discovery);
    # itsdangerous signs the Starlette session cookie. Google client id/secret +
    # the session secret are read from env only — never .env*/secrets/.
    "authlib~=1.7",
    "itsdangerous~=2.2",
    # --- planner model seam (ADR-0004: PydanticAI orchestration + LiteLLM routing) ---
    "pydantic-ai~=2.21",
    "litellm~=1.94",
    # Anthropic-native adapter SDK (ADR-0004 M1 adapter), pinned now at spec-001 Phase 1
    # setup rather than deferred to DU-02 (ADR-0007 point 4's original plan) so the whole
    # slice-001 dependency set resolves together, mirroring how pydantic-ai/litellm were
    # pre-pinned at DU-00 before planner code existed. Import stays confined to
    # commons/llm.py (the seam) — tests/test_llm_seam.py (DU-02) is the guard.
    "anthropic~=0.120",
    # --- persistence (planner checkpoint + PostGIS access, migrations) ---
    "sqlalchemy~=2.0",
    "alembic~=1.14",
    "psycopg[binary]~=3.2",
    # GeoAlchemy2 = the SQLAlchemy <-> PostGIS geometry-column bridge (commons/db.py,
    # DU-02/03: `site.geom geometry(Point,4326)` GiST-indexed) — sits alongside
    # sqlalchemy/psycopg, not the seam.
    "geoalchemy2~=0.20",
    # httpx = the Overpass HTTP client (commons/sources/osm.py, ADR-0009 R2) — already a
    # transitive dep of pydantic-ai/fastapi's stack; pinned directly since product code
    # imports it, not just test infra.
    "httpx~=0.28",
]

[dependency-groups]
dev = [
    "pytest~=9.0",
    "pytest-asyncio~=1.0",
    "hypothesis~=6.122",
    "ruff~=0.14",
    "mypy~=1.14",
    "pre-commit~=4.0",
    # --- eval harness libs (test-strategy tiers; harness itself lands at unit e) ---
    "deepeval~=4.1",
    "agentevals~=0.0.9",
    # --- Tier-2 integration + snapshot testing (spec-001 Phase 1 setup) ---
    "testcontainers~=4.15",
    "syrupy~=5.5",
]

[tool.uv]
# Security-gate resolution (pip-audit, CI job 6, ADR-0007 amendment): force the
# transitive `langchain` (via agentevals→openevals) to the advisory-fixed release.
# Dev/eval-only, never in the product runtime; keeps the security gate at zero
# ignores so it reddens only on genuinely new CVEs.
#
# `cryptography>=50.0.0` fixes PYSEC-2026-3552, pulled in transitively by the
# Google-OIDC login path (authlib → joserfc/pyjwt, google-auth). Unlike the
# langchain pin above this one IS in the product runtime: it is the library
# verifying Google's token signatures, so the advisory is on the security-critical
# path (api/AGENTS.md) rather than in a dev-only tool.
constraint-dependencies = ["langchain>=1.3.9", "cryptography>=50.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Python packages of the monorepo. `web/` is a JS/Vite app, not a Python package.
packages = ["commons", "planner", "compiler", "api"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Not py312 app source: throwaway spike; ephemeral worktrees; .claude/ hooks,
# which the harness runs under bare system python3 (3.9) — linting them at py312
# would rewrite them to 3.11+ idioms (e.g. datetime.UTC) and crash the hook; and
# docs/ and specs/, whose fenced ```python snippets are hand-aligned illustrative
# reference/spec code, not app source — `ruff format` would collapse their comment
# alignment or churn spec/plan pseudo-code (pre-commit's ruff-format already skips
# markdown, so this keeps CI consistent).
extend-exclude = ["spike", ".claude", "docs", "specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# packages appear incrementally; keep unstubbed third-party geo libs from failing the skeleton
ignore_missing_imports = true
# Mirror ruff's extend-exclude: the throwaway spike (gitignored, duplicate module
# names) and .claude/ hooks (run under system python 3.9) are not py312 app source.
# Without this, `mypy .` aborts on spike/'s duplicate `run` module (FAIL-003).
exclude = ['^spike/', '^\.claude/']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]

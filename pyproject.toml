[project]
name = "siyur"
version = "0.0.0"
description = "Siyur — plan a tour day online with an LLM, compile a self-contained offline map bundle, travel with zero connectivity."
requires-python = ">=3.12,<3.13"
readme = "README.md"

# Pinned to majors with compatible-release (~=) per the stack reference + the
# geo stale-API discipline in AGENTS.md. Geo pins are exact-major and verified
# (shapely 2.1.x / h3 4.5.x / osmnx 2.1.x / geopandas 1.1.x). LLM + eval deps
# (pydantic-ai, litellm, deepeval, agentevals) are intentionally deferred to the
# units that introduce them (seam = DU-00 unit d; evals = unit e), pinned there
# against current docs — not guessed here.
dependencies = [
    # --- geospatial core (see AGENTS.md "Geo APIs" table — do NOT emit v-old idioms) ---
    "shapely~=2.1",
    "h3~=4.5",
    "osmnx~=2.1",
    "geopandas~=1.1",
    "pyproj~=3.7",
    "duckdb~=1.3",
    # --- data model + web/service spine ---
    "pydantic~=2.11",
    "fastapi~=0.118",
    "uvicorn~=0.34",
    # --- persistence (planner checkpoint + PostGIS access, migrations) ---
    "sqlalchemy~=2.0",
    "alembic~=1.14",
    "psycopg[binary]~=3.2",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "hypothesis~=6.122",
    "ruff~=0.14",
    "mypy~=1.14",
    "pre-commit~=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Python packages of the monorepo. `web/` is a JS/Vite app, not a Python package.
packages = ["commons", "planner", "compiler", "api"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Not py312 app source: throwaway spike; ephemeral worktrees; and .claude/ hooks,
# which the harness runs under bare system python3 (3.9) — linting them at py312
# would rewrite them to 3.11+ idioms (e.g. datetime.UTC) and crash the hook.
extend-exclude = ["spike", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# packages appear incrementally; keep unstubbed third-party geo libs from failing the skeleton
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
